name: laps
options:
  bundleIdPrefix: com.squirrelrock
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6Y4GKX652F
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "9"
targets:
  laps:
    type: application
    platform: iOS
    sources:
      - laps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.squirrelrock.laps
        PRODUCT_NAME: laps
        INFOPLIST_KEY_CFBundleDisplayName: laps
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  lapsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - lapsTests
    dependencies:
      - target: laps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.squirrelrock.lapsTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/laps.app/laps"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  laps:
    build:
      targets:
        laps: all
        lapsTests: [test]
    test:
      targets:
        - lapsTests
